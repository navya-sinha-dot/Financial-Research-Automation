<!DOCTYPE html>
<html>
  <head><title>Example 10-Q (SEC-style spacer/currency-symbol columns, e.g. Microsoft)</title></head>
  <body>
    <span>INCOME STATEMENTS</span>
    <table>
      <tr><th></th><th colspan="2">2025</th><th colspan="2">2024</th></tr>
      <tr>
        <td>Total revenue</td>
        <td>&#160;</td><td>$</td><td>65,585</td>
        <td>&#160;</td><td>$</td><td>61,858</td>
      </tr>
      <tr>
        <td>Net income</td>
        <td>&#160;</td><td>$</td><td>24,667</td>
        <td>&#160;</td><td>$</td><td>21,939</td>
      </tr>
      <tr>
        <!-- section header row: label only, every following cell is a spacer -->
        <td>Cost of revenue:</td>
        <td>&#160;</td><td>&#160;</td><td>&#160;</td>
        <td>&#160;</td><td>&#160;</td><td>&#160;</td>
      </tr>
    </table>
  </body>
</html>
